<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="TerraAgent Real-Time Colony Market and NEAR Intents NEP-413 Atomic Swap">
  <defs>
    <style>
      .bg { fill: #060912; }
      .panel { fill: #0b1120; stroke: #1e293b; stroke-width: 1.5; }
      .panel-o { fill: #0e1628; stroke: #ff5a1f; stroke-width: 1.6; }
      .panel-c { fill: #0a1426; stroke: #22d3ee; stroke-width: 1.6; }
      .panel-g { fill: #081814; stroke: #22c55e; stroke-width: 1.6; }
      .title { font: 700 13px 'JetBrains Mono', ui-monospace, monospace; fill: #f8fafc; letter-spacing: 1px; }
      .hdr-o { font: 700 11px 'JetBrains Mono', ui-monospace, monospace; fill: #ff5a1f; }
      .hdr-c { font: 700 11px 'JetBrains Mono', ui-monospace, monospace; fill: #22d3ee; }
      .hdr-g { font: 700 11px 'JetBrains Mono', ui-monospace, monospace; fill: #22c55e; }
      .hdr-r { font: 700 11px 'JetBrains Mono', ui-monospace, monospace; fill: #f87171; }
      .txt { font: 500 10.5px 'JetBrains Mono', ui-monospace, monospace; fill: #e2e8f0; }
      .muted { font: 500 9.5px 'JetBrains Mono', ui-monospace, monospace; fill: #94a3b8; }
      .row { fill: #121b2f; stroke: #293548; stroke-width: 1; }
      .flow-c { fill: none; stroke: #22d3ee; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.5s linear infinite; }
      .flow-o { fill: none; stroke: #ff5a1f; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.5s linear infinite; }
      .flow-g { fill: none; stroke: #22c55e; stroke-width: 2.2; stroke-dasharray: 6 5; animation: dash 1.2s linear infinite; }
      .flash { animation: pulse 2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="480" class="bg"/>
  <polygon points="16,14 1172,14 1184,26 1184,50 16,50" fill="#0b1222" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="24" y="22" width="10" height="20" fill="#22d3ee"/>
  <text x="44" y="36" class="title">REAL-TIME PLANET GUILD MARKET (VWAP) &lt;-&gt; NEAR INTENTS (NEP-413) + TRACK 07 GUARDRAILS</text>

  <!-- LEFT: LIVE PLANET ORDERBOOK & VWAP -->
  <polygon points="24,68 380,68 394,82 394,454 24,454" class="panel-o"/>
  <text x="42" y="92" class="hdr-o">1. REAL-TIME COLONY GUILD MARKET (/trade.html)</text>
  <text x="42" y="108" class="muted">24/7 WebSocket tick updates + 16-tick VWAP window</text>

  <!-- Price Curve Chart -->
  <rect x="42" y="122" width="332" height="92" fill="#060b16" stroke="#1e293b"/>
  <polyline points="52,192 92,184 132,188 172,166 212,172 252,146 292,152 332,134 364,138" fill="none" stroke="#ff5a1f" stroke-width="2.2"/>
  <circle cx="332" cy="134" r="4" fill="#ff5a1f" class="flash"/>
  <text x="52" y="138" class="hdr-o">bio.water SURGE (THIN-SIDE SPREAD)</text>
  <text x="52" y="205" class="muted">Guild: mid = ref * (target / inv)^k</text>

  <!-- Orderbook Rows -->
  <g transform="translate(42,226)">
    <rect width="332" height="34" class="row"/>
    <text x="10" y="21" class="txt">metals.t1</text>
    <text x="135" y="21" class="hdr-g">ASK 500 @ 1.00 NEAR</text>
  </g>
  <g transform="translate(42,266)">
    <rect width="332" height="34" class="row"/>
    <text x="10" y="21" class="txt">minerals.t1</text>
    <text x="135" y="21" class="hdr-c">BID 320 @ 1.15 NEAR</text>
  </g>
  <g transform="translate(42,306)">
    <rect width="332" height="34" class="row"/>
    <text x="10" y="21" class="txt">bio.water</text>
    <text x="135" y="21" class="hdr-o">SURGE 250 @ 1.45 NEAR</text>
  </g>
  <g transform="translate(42,346)">
    <rect width="332" height="34" class="row"/>
    <text x="10" y="21" class="txt">metals.t2 / min.t3</text>
    <text x="135" y="21" class="hdr-r">RARE D-34 TIER ASSETS</text>
  </g>
  <rect x="42" y="392" width="332" height="46" fill="#0d172a" stroke="#334155"/>
  <text x="54" y="411" class="hdr-c">Bot + Human Order Matching</text>
  <text x="54" y="427" class="muted">Guild sink/floor prevents death-spirals (GDD §9.3)</text>

  <!-- CENTER: NEP-413 INTENT VERIFIER + 1CLICK -->
  <polygon points="434,68 776,68 790,82 790,454 434,454" class="panel-c"/>
  <text x="452" y="92" class="hdr-c">2. NEAR INTENTS (NEP-413 + 1CLICK)</text>
  <text x="452" y="108" class="muted">Counter-signed Ed25519 zero-sum token_diff batch</text>

  <!-- Party A Delta -->
  <rect x="452" y="126" width="320" height="72" fill="#091326" stroke="#ff5a1f" stroke-width="1.2"/>
  <text x="464" y="146" class="hdr-o">SIGNER A (AI BOT // z-ai/glm-5.3)</text>
  <text x="464" y="164" class="txt">metals.t1: -500  |  bio.water: +200</text>
  <text x="464" y="182" class="muted">sig: ed25519:3vK8.. + nonce + deadline</text>

  <!-- Party B Delta -->
  <rect x="452" y="210" width="320" height="72" fill="#091326" stroke="#22c55e" stroke-width="1.2"/>
  <text x="464" y="230" class="hdr-g">SIGNER B (PLAYER OR GUILD COUNTERPARTY)</text>
  <text x="464" y="248" class="txt">metals.t1: +500  |  bio.water: -200</text>
  <text x="464" y="266" class="muted">1Click Cross-Chain Dry Quote: USDC -&gt; NEAR</text>

  <!-- Conservation Check -->
  <polygon points="482,300 742,300 754,312 754,370 470,370 470,312" fill="#062219" stroke="#22c55e" stroke-width="2" class="flash"/>
  <text x="506" y="328" class="hdr-g">VERIFIER INVARIANT: SUM(DIFF) == 0</text>
  <text x="492" y="348" class="txt">metals: -500+500 = 0 | bio.water: +200-200 = 0</text>

  <rect x="452" y="388" width="320" height="50" fill="#0d172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="464" y="408" class="hdr-c">Replay &amp; Expiry Guards Enforced</text>
  <text x="464" y="426" class="muted">NEAR_INTENT_NONCE_REUSED / EXPIRED / DIFF_NOT_ZERO</text>

  <!-- RIGHT: TRACK 07 AGENT WALLET POLICY + ON-CHAIN SETTLEMENT -->
  <polygon points="830,68 1176,68 1176,454 816,454 816,82" class="panel-g"/>
  <text x="836" y="92" class="hdr-g">3. AGENT WALLET + ON-CHAIN CLEAR</text>
  <text x="836" y="108" class="muted">Track 07 Limited Keys (AW-11 / AW-13 / D-18)</text>

  <rect x="836" y="128" width="320" height="106" fill="#091322" stroke="#334155"/>
  <text x="850" y="150" class="hdr-o">ED25519 LIMITED SESSION POLICY</text>
  <text x="850" y="170" class="txt">- Allowlist: ['res', 'bounty', 'intents']</text>
  <text x="850" y="188" class="txt">- Daily Cap: 1000 tokens / 24h UTC window</text>
  <text x="850" y="206" class="txt">- Non-custodial: keys never exported</text>
  <text x="850" y="222" class="hdr-g">- Instant 1-click revoke() supported</text>

  <rect x="836" y="248" width="320" height="92" fill="#1b110d" stroke="#ff5a1f" stroke-width="1.3"/>
  <text x="850" y="268" class="hdr-o">AW-13 &amp; D-18 SAFETY GUARDRAILS</text>
  <text x="850" y="288" class="txt">- AW-13: AI limited keys non-transferable</text>
  <text x="850" y="306" class="txt">- D-18: Staking 403 AI_STAKING_FORBIDDEN</text>
  <text x="850" y="324" class="muted">NEAR_ALLOWANCE_EXHAUSTED if cap hit</text>

  <rect x="836" y="354" width="320" height="84" fill="#071a16" stroke="#22c55e" stroke-width="1.4"/>
  <text x="850" y="376" class="hdr-g">ATOMIC ON-CHAIN SETTLEMENT</text>
  <text x="850" y="396" class="txt">intents.near::execute_intents(signed)</text>
  <text x="850" y="414" class="txt">res.terraagent.testnet::mt_transfer_batch</text>
  <text x="850" y="430" class="muted">Tx receipt persisted -&gt; WebSocket broadcast</text>

  <!-- Animated Arrows & Flowing Packets -->
  <path d="M394 180 H434" class="flow-o"/>
  <path d="M434 250 H394" class="flow-c"/>
  <path d="M790 190 H816" class="flow-c"/>
  <path d="M790 390 H816" class="flow-g"/>
  <circle r="4" fill="#ff5a1f"><animateMotion dur="1.2s" repeatCount="indefinite" path="M394,180 L434,180"/></circle>
  <circle r="4" fill="#22d3ee"><animateMotion dur="1.2s" repeatCount="indefinite" path="M434,250 L394,250"/></circle>
  <circle r="4" fill="#22c55e"><animateMotion dur="1.3s" repeatCount="indefinite" path="M790,390 L816,390"/></circle>
</svg>
