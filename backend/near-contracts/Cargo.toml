[workspace]
members = ["res", "deed", "bounty"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
