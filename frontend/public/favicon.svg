<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ta-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E5BFF"/>
      <stop offset="100%" stop-color="#0D2C8C"/>
    </linearGradient>
    <linearGradient id="ta-orange-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF6A13"/>
    </linearGradient>
  </defs>
  <!-- Outer chamfered dark void plate -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#07080A" stroke="#FF6A13" stroke-width="3.2"/>
  <!-- Inner armor bevel ring -->
  <polygon points="32,8 52,19.5 52,44.5 32,56 12,44.5 12,19.5" fill="#111318" stroke="#262B36" stroke-width="1.5"/>
  <!-- Orbital trajectory arc -->
  <ellipse cx="32" cy="34" rx="18" ry="7.5" transform="rotate(-18 32 34)" fill="none" stroke="#1E5BFF" stroke-width="2" stroke-dasharray="5 2.5"/>
  <!-- Planetary command visor -->
  <polygon points="16,27 48,27 44,38 20,38" fill="url(#ta-core)" stroke="#4C82FF" stroke-width="1.2"/>
  <!-- High-contrast hull telemetry bar -->
  <rect x="23" y="30.5" width="18" height="4" fill="#F2F4F7"/>
  <!-- Ignition beacon spire & drop vector -->
  <path d="M32 10 V22" stroke="url(#ta-orange-glow)" stroke-width="3.2" stroke-linecap="square"/>
  <polygon points="32,25 27.5,19 36.5,19" fill="#FF6A13"/>
  <!-- Base thruster node -->
  <polygon points="27,43 37,43 34.5,50 29.5,50" fill="#FF6A13"/>
  <circle cx="32" cy="11" r="2.2" fill="#F2F4F7"/>
</svg>
