  <text x="460" y="333" class="txt">1. Seller Principal : 100.00% ($100.00)</text>
  <text x="460" y="350" class="txt">2. Stall Owner Fee  : +0.00%-1.00% (+$0.50)</text>
  <text x="460" y="367" class="txt">3. Planet DAO (20%) : +0.20% / +0.13% ($0.20)</text>
  <text x="460" y="384" class="txt-c">4. Protocol (80%)   : +0.80% / +0.52% ($0.80)</text>

