  <text x="52" y="293" class="txt">staking.terraagent.testnet (9.00% validator APY)</text>
  <text x="52" y="311" class="txt">80% (7.20% APY) -&gt; Human Pilot (100% principal)</text>
  <text x="52" y="329" class="txt">20% (1.80% APY) -&gt; Protocol Treasury</text>
  <rect x="52" y="339" width="320" height="24" fill="#090d16" stroke="#2c3548"/>
