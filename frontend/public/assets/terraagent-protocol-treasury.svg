<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="TerraAgent Protocol Self-Sustaining On-Chain Treasury: 3 Organic Inflows, Clearing Core, and 2 Infrastructure Outflows">
  <defs>
    <style>
      .bg { fill: #060912; }
      .panel-o { fill: #0d1424; stroke: #ff6a13; stroke-width: 1.6; }
      .panel-c { fill: #091324; stroke: #39d0ff; stroke-width: 1.6; }
      .panel-g { fill: #081814; stroke: #3ddc84; stroke-width: 1.6; }
      .box { fill: #0a101d; stroke: #222a3a; stroke-width: 1.2; }
      .box-o { fill: #151110; stroke: #ff6a13; stroke-width: 1.3; }
      .box-c { fill: #0b1626; stroke: #39d0ff; stroke-width: 1.3; }
      .box-g { fill: #091b16; stroke: #3ddc84; stroke-width: 1.3; }
