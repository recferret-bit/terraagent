      .hdr-o { font: 700 11px 'IBM Plex Mono', ui-monospace, monospace; fill: #ff8a3d; letter-spacing: 0.6px; }
      .hdr-c { font: 700 11px 'IBM Plex Mono', ui-monospace, monospace; fill: #39d0ff; letter-spacing: 0.6px; }
      .hdr-g { font: 700 11px 'IBM Plex Mono', ui-monospace, monospace; fill: #3ddc84; letter-spacing: 0.6px; }
      .hdr-r { font: 700 11px 'IBM Plex Mono', ui-monospace, monospace; fill: #ff6b6b; letter-spacing: 0.6px; }
      .txt { font: 500 10.2px 'IBM Plex Mono', ui-monospace, monospace; fill: #dbe2ef; }
      .txt-c { font: 700 10.2px 'IBM Plex Mono', ui-monospace, monospace; fill: #39d0ff; }
      .muted { font: 500 9.4px 'IBM Plex Mono', ui-monospace, monospace; fill: #8a93a6; }
      .muted-g { font: 700 9.4px 'IBM Plex Mono', ui-monospace, monospace; fill: #3ddc84; }
      .wire-o { fill: none; stroke: #ff6a13; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.5s linear infinite; }
      .wire-c { fill: none; stroke: #39d0ff; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.6s linear infinite; }
      .wire-g { fill: none; stroke: #3ddc84; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.4s linear infinite; }
      .wire-r { fill: none; stroke: #ff6b6b; stroke-width: 2; stroke-dasharray: 6 5; animation: dash 1.7s linear infinite; }
      .ring-spin { transform-origin: 600px 210px; animation: spin 22s linear infinite; }
      .pulse { animation: pulseOp 2.2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulseOp { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .wire-o, .wire-c, .wire-g, .wire-r, .ring-spin, .pulse { animation: none; }
      }
    </style>
