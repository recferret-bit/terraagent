  <text x="52" y="441" class="txt">90% -&gt; Betrayed Treaty Partner / War Defender</text>
  <text x="52" y="459" class="txt">10% -&gt; Protocol Treasury slash penalty</text>
  <rect x="52" y="469" width="320" height="24" fill="#090d16" stroke="#2c3548"/>
  <text x="60" y="485" class="hdr-r">20 NEAR breach -&gt; 18.0 Victim + 2.0 Proto</text>

