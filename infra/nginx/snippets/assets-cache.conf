# Unhashed SSR entry wrapper for /deed/:tokenId imports hashed chunks and must revalidate.
location ~ ^/assets/deed-entry\.(?:js|css)$ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;
}

# Hashed Vite assets. Include from a server that serves the shared dist root.
location /assets/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Brand icons, manifest, social card, and achievement badges (24h public cache).
location ~ ^/(?:favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|site\.webmanifest|og-cover\.png|img/) {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
}
