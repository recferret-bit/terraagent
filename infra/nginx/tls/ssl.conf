# Activated into /etc/nginx/tls-server/ once Let's Encrypt certificates exist.
listen 443 ssl;
http2 on;
ssl_certificate /etc/letsencrypt/live/terraagent.fun/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/terraagent.fun/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_buffer_size 4k;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Redirect HTTP -> HTTPS while leaving ACME HTTP-01 challenges on port 80.
set $acme_or_https "";
if ($scheme = http) {
  set $acme_or_https "H";
}
if ($request_uri ~ "^/\.well-known/acme-challenge/") {
  set $acme_or_https "";
}
if ($acme_or_https = "H") {
  return 301 https://$host$request_uri;
}
