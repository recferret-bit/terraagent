# terraagent.fun edge (D-37, DEP-01..03). HTTP only. No proxy and no throttling (D-25, D-37).
# A stack adds a file under /etc/nginx/hosts (bind-mounted from infra/nginx/hosts). It does not edit this file.
# proxy_pass uses a variable so Docker DNS is asked per request: static pages still answer when `app` is down.
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/hosts/*.conf;
}
