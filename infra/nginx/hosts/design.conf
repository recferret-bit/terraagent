# design.terraagent.fun (DEPLOYMENT §2). / and /design/ are the design index.
server {
  listen 80;
  server_name design.terraagent.fun;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /design/index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
