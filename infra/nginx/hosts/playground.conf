# playground.terraagent.fun (DEPLOYMENT §2). Unknown paths fall back to the app shell.
server {
  listen 80;
  server_name playground.terraagent.fun;
  root /usr/share/nginx/html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /playground.html =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /playground.html;
  }
}
