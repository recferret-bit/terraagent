# play.terraagent.fun (DEPLOYMENT §2). HTML stays up when app:3000 does not.
server {
  listen 80;
  server_name play.terraagent.fun;
  include /etc/nginx/snippets/acme-challenge.conf;
  include /etc/nginx/tls-server/*.conf;
  root /usr/share/nginx/html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;
  include /etc/nginx/snippets/play-csp.conf;

  error_page 404 /404.html;

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
  }

  # `/` is the document root directory. An exact match avoids indexing the dev hub.
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /play.html =404;
  }

  location = /index.html {
    return 301 /;
  }

  location = /me {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /me.html =404;
  }

  location = /me/ {
    return 301 /me;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  location /v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location ^~ /deed/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location /ws {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }
}
