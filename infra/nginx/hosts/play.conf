# play.terraagent.fun (DEPLOYMENT §2). HTML stays up when app:3000 does not.
server {
  listen 80;
  server_name play.terraagent.fun;
  root /usr/share/nginx/html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;
  include /etc/nginx/snippets/play-csp.conf;

  # `/` is the document root directory. An exact match avoids indexing the dev hub.
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /play.html =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /play.html;
  }

  location /v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location /ws {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }
}
