# pitchdeck.terraagent.fun (DEPLOYMENT §2). The site index is the pitch page.
server {
  listen 80;
  server_name pitchdeck.terraagent.fun;
  root /usr/share/nginx/html;
  index /pitchdeck/index.html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /pitchdeck/index.html =404;
  }

  location = /pitchdeck/index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /pitchdeck/index.html;
  }
}
