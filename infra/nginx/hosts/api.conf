# api.terraagent.fun (DEP-03). Only /v1/ and /ws reach the app. Anything else is 404.
server {
  listen 80;
  server_name api.terraagent.fun;

  location /v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location /ws {
    include /etc/nginx/snippets/security-headers.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    default_type text/plain;
    return 404 "not found\n";
  }
}
