# devchain.terraagent.fun (D-40, D-24). Explorer HTML is static from the shared dist root.
# /v1/dev/chain/ proxies to the app. A missing app fails only that location.
server {
  listen 80;
  server_name devchain.terraagent.fun;
  include /etc/nginx/snippets/acme-challenge.conf;
  include /etc/nginx/tls-server/*.conf;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  # The document root is a directory, so try_files $uri/ would 403 "/". Send that index here.
  index /dev/chain/index.html;

  location = /robots.txt {
    include /etc/nginx/snippets/security-headers.conf;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location ^~ /dev/chain/tx {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /dev/chain/tx.html =404;
  }

  location /v1/dev/chain/ {
    include /etc/nginx/snippets/security-headers.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /dev/chain/index.html;
  }
}
