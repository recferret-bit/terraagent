# whitepaper.terraagent.fun (DEPLOYMENT §2). The page is the rendered whitepaper.
server {
  listen 80;
  server_name whitepaper.terraagent.fun;
  include /etc/nginx/snippets/acme-challenge.conf;
  include /etc/nginx/tls-server/*.conf;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  error_page 404 /404.html;

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /whitepaper/index.html =404;
  }

  location = /index.html {
    return 301 /;
  }

  location ^~ /v1/analytics/ {
    include /etc/nginx/snippets/security-headers.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
