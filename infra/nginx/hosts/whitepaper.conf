# whitepaper.terraagent.fun (DEPLOYMENT §2). The page is the rendered whitepaper.
server {
  listen 80;
  server_name whitepaper.terraagent.fun;
  root /usr/share/nginx/html;
  index /whitepaper/index.html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /whitepaper/index.html =404;
  }

  location / {
    try_files $uri $uri/ /whitepaper/index.html;
  }
}
