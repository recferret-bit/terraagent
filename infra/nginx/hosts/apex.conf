# terraagent.fun (DEPLOYMENT §2). The site index is landing.html, not the dev hub.
server {
  listen 80;
  server_name terraagent.fun;
  root /usr/share/nginx/html;
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/assets-cache.conf;
  include /etc/nginx/snippets/play-csp.conf;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/html;
    try_files /landing.html =404;
  }

  location = /landing.html {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location ^~ /deed/ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location /ws {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    set $terra_app app:3000;
    include /etc/nginx/snippets/proxy-app.conf;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/play-csp.conf;
    try_files $uri $uri/ =404;
  }
}

server {
  listen 80;
  server_name www.terraagent.fun;
  return 301 $scheme://terraagent.fun$request_uri;
}
