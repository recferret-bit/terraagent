# Infra stack (DEP-01, DEPLOYMENT §1). Only nginx publishes a port.
# Postgres exists for the remote host under profile `server` and has no published port.
# Local `stack:local` does not enable that profile; the app keeps the dev Postgres on 15434.
name: terra-infra

x-logging: &json-log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  terra_edge:
    name: terra_edge
  terra_internal:
    name: terra_internal

volumes:
  terra_www:
    name: terra_www
  terra_pg:
    name: terra_sites_pg
  terra_certs:
    name: terra_certs
  terra_certbot_www:
    name: terra_certbot_www

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: terra-nginx
    restart: unless-stopped
    logging: *json-log
    ports:
      - "80:80"
      - "443:443"
    networks:
      - terra_edge
    entrypoint: ["/docker-entrypoint-tls.sh"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/hosts:/etc/nginx/hosts:ro
      - ../nginx/tls:/etc/nginx/tls-available:ro
      - ../nginx/docker-entrypoint.sh:/docker-entrypoint-tls.sh:ro
      - terra_www:/usr/share/nginx/html:ro
      - terra_certs:/etc/letsencrypt:ro
      - terra_certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: terra-certbot
    profiles: ["server"]
    restart: unless-stopped
    logging: *json-log
    volumes:
      - terra_certbot_www:/var/www/certbot
      - terra_certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  # Profile `server` is off on the laptop, and Compose creates a network only when a
  # started service uses it. This process keeps terra_internal so the app can attach.
  net:
    image: busybox:1.36
    container_name: terra-internal-net
    restart: unless-stopped
    logging: *json-log
    command: ["sleep", "infinity"]
    networks:
      - terra_internal

  postgres:
    image: postgres:16-alpine
    container_name: terra-sites-pg
    profiles: ["server"]
    restart: unless-stopped
    logging: *json-log
    networks:
      terra_internal:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra
      POSTGRES_DB: terraagent
    volumes:
      - terra_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terraagent"]
      interval: 3s
      timeout: 3s
      retries: 20
