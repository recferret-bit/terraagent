# Backend stack (DEP-01, DEPLOYMENT §1). The app joins terra_edge and publishes no port.
# Local database is the dev Postgres on host port 15434, not a database in this file.
name: terra-backend

x-logging: &json-log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  terra_edge:
    external: true
    name: terra_edge

services:
  app:
    image: terra-app:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
    container_name: terra-app
    restart: unless-stopped
    logging: *json-log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TA_HOST: 0.0.0.0
      PORT: "3000"
      # development: /v1/dev/chain/receipts is 404 when NODE_ENV=production, and the W26 demo needs that JSON.
      NODE_ENV: development
      # Host env TA_DB_NAME, default terraagent. SIM_THREADS stays unset (cores − 1).
      TA_DB_NAME: ${TA_DB_NAME:-terraagent}
      DATABASE_URL: postgresql://terra:terra@host.docker.internal:15434/${TA_DB_NAME:-terraagent}
    networks:
      terra_edge:
        aliases:
          - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 30s
      interval: 5s
      retries: 20
