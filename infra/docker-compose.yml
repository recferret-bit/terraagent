# Shared dev Postgres. One server, one database per worktree (TA_DB_NAME), created on demand by `npm run db:migrate`.
name: terraagent
services:
  postgres:
    image: postgres:16-alpine
    container_name: terra-pg
    restart: unless-stopped
    ports:
      - '15434:5432'
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra
      POSTGRES_DB: terraagent
    volumes:
      - terra-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terra -d terraagent']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  terra-pg-data:
